name: compilar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  arduino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Instalar placa ESP32 y LovyanGFX
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@2.0.17 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "LovyanGFX@1.1.16"
      - name: Compilar
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,CDCOnBoot=default \
            --output-dir build MocciaCAN
      - uses: actions/upload-artifact@v4
        with:
          name: MocciaCAN-bin
          path: build/*.bin
